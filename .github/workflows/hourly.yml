name: Hourly

on:
  schedule:
    # 每小時第 23 分。負載高時 GitHub 會延後排程的執行，每小時開頭負載最高。
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# 與 daily 共用：狀態檔同時只有一個執行在改，後到的排隊等待。
concurrency:
  group: state
  cancel-in-progress: false

jobs:
  hourly:
    # 狀態檔只屬於 main，從其他分支手動執行時不做任何事。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      site: ${{ steps.site.outputs.uploaded }}
      locale: ${{ steps.locale.outputs.locale }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 取分支最新的 commit，重跑或排隊的執行才看得到先前已 push 的狀態。
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.10"
          python-version: "3.14"
      # 失敗通知依 site.locale 選用語言；讀不到時用繁中。
      - name: 讀取語言
        id: locale
        continue-on-error: true
        run: python3 -c 'import tomllib; print("locale=" + tomllib.load(open("config.toml", "rb"))["site"]["locale"])' >> "$GITHUB_OUTPUT"
      - name: 安裝相依套件（依 uv.lock）
        run: uv sync --locked --no-dev

      - name: 讀取 KEV
        id: kev
        continue-on-error: true
        timeout-minutes: 10
        run: .venv/bin/starfault kev

      - name: KEV 推播
        id: push
        if: steps.kev.outcome == 'success'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ vars.TELEGRAM_THREAD_ID }}
          STARFAULT_WATCHLIST: ${{ secrets.STARFAULT_WATCHLIST }}
        run: .venv/bin/starfault push

      - name: 讀取 CVE delta
        id: cve
        continue-on-error: true
        timeout-minutes: 10
        run: .venv/bin/starfault cve

      # KEV 快照、已通知清單或關注清單有變動才 commit，每日新 CVE 的變動跟著一起保存；
      # 只有每日紀錄變動時不 commit，下一次執行會從 delta 重新算出。
      - name: commit 並 push 狀態
        id: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet -- state/kev.json state/notified.json state/watch; then
            echo "狀態沒有需要保存的變動"
            exit 0
          fi
          git commit -q -m "chore(state): $(date -u +%FT%H:%MZ) 每小時更新"
          for attempt in 1 2 3; do
            if git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            git rebase --abort 2> /dev/null || true
            sleep $((attempt * 10))
          done
          echo "::error::push 失敗三次"
          exit 1

      - name: 產生網站
        id: build_site
        if: ${{ !cancelled() }}
        run: .venv/bin/starfault site --out _site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: ${{ !cancelled() && steps.build_site.outcome == 'success' }}
        with:
          path: _site

      - name: 記錄網站已上傳
        id: site
        if: ${{ !cancelled() && steps.build_site.outcome == 'success' }}
        run: echo "uploaded=true" >> "$GITHUB_OUTPUT"

      - name: 各步驟結果
        if: >-
          ${{ !cancelled() && (
            steps.kev.outcome == 'failure' ||
            steps.push.outcome == 'failure' ||
            steps.cve.outcome == 'failure'
          ) }}
        run: |
          echo "::error::kev ${{ steps.kev.outcome }}、push ${{ steps.push.outcome }}、cve ${{ steps.cve.outcome }}"
          exit 1

      - name: 失敗通知
        if: ${{ failure() || cancelled() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ vars.TELEGRAM_THREAD_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LOCALE: ${{ steps.locale.outputs.locale }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            exit 0
          fi
          if [ "$LOCALE" = "en" ]; then
            text="starfault hourly workflow failed or timed out: $RUN_URL"
          else
            text="starfault hourly workflow 失敗或逾時：$RUN_URL"
          fi
          args=(--data-urlencode "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=$text")
          # 去掉前後空白後，空值不帶主題，同 cli.thread_id；其他值照帶，不合法時由 Telegram 拒絕。
          thread="$TELEGRAM_THREAD_ID"
          thread="${thread#"${thread%%[![:space:]]*}"}"
          thread="${thread%"${thread##*[![:space:]]}"}"
          if [ -n "$thread" ]; then
            args+=(--data-urlencode "message_thread_id=$thread")
          fi
          curl -sS --fail -o /dev/null "${args[@]}" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"

  deploy:
    # hourly 因資料來源失敗而標為失敗時，網站仍照常部署，停更提醒會顯示在網站上。
    needs: hourly
    if: ${{ !cancelled() && needs.hourly.outputs.site == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: 失敗通知
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ vars.TELEGRAM_THREAD_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LOCALE: ${{ needs.hourly.outputs.locale }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            exit 0
          fi
          if [ "$LOCALE" = "en" ]; then
            text="starfault site deployment failed: $RUN_URL"
          else
            text="starfault 網站部署失敗：$RUN_URL"
          fi
          args=(--data-urlencode "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=$text")
          # 去掉前後空白後，空值不帶主題，同 cli.thread_id；其他值照帶，不合法時由 Telegram 拒絕。
          thread="$TELEGRAM_THREAD_ID"
          thread="${thread#"${thread%%[![:space:]]*}"}"
          thread="${thread%"${thread##*[![:space:]]}"}"
          if [ -n "$thread" ]; then
            args+=(--data-urlencode "message_thread_id=$thread")
          fi
          curl -sS --fail -o /dev/null "${args[@]}" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"
