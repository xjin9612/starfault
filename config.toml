# starfault 設定。載入時會檢查型別與範圍；未知的鍵視為錯誤。

[thresholds]
# EPSS 首次跨過此值時列入每日摘要。0.0001 到 1。
epss = 0.10
# CVSS ≥ 此值且還沒有 EPSS 時列入每日摘要。0.1 到 10。
cvss = 9.0
# EPSS 規則只看發布幾天內的 CVE。1 到 90。
epss_window_days = 30
# 這天之前，規則頁把門檻標示為暫定值。門檻定案後刪除這一行。
calibrating_until = "2026-12-04"

[translation]
# 關注清單的標題與描述翻成這個語言（BCP 47 語言代碼，例如 zh-TW、ja）。
# 空字串表示不翻譯，也不呼叫模型。換語言後要從頭翻，每次最多翻 max_per_run 則。
target = "zh-TW"
# 模型供應商：gemini（需要 GEMINI_API_KEY）或 anthropic（需要 ANTHROPIC_API_KEY）。
provider = "gemini"
# 供應商的模型名稱，例如 gemini-3.5-flash-lite 或 claude-opus-5-5。
model = "gemini-3.5-flash-lite"
# model 重試後仍回應 429、5xx 或找不到時依序改用的模型，只用於 gemini；anthropic 設為 []。
fallback_models = ["gemini-3.5-flash"]
# 每次請求送出的文字則數，上限 100。Gemini 免費方案一次送多則時常回應 503，所以設為 1。
batch_size = 1
# 每次執行最多翻譯幾則文字，上限 5000；0 表示不翻譯。
max_per_run = 60
# 兩次請求之間等待的秒數，避免超過每分鐘的請求上限。0 以上。
request_interval_seconds = 4

[watchlist]
# 技術棧命中時，CVSS ≥ 此值或未評分就列入每日摘要的「你的技術棧」段落。0 到 10。
# 清單本身不寫在這裡：放在 secret STARFAULT_WATCHLIST，本機用 watchlist.toml（不進版控）。
cvss = 7.0

[site]
# 網站與 Telegram 訊息的語言：zh-TW 或 en。CVE 內容的翻譯另由 [translation] 決定。
locale = "zh-TW"
# 「今天」與每日統計依此時區判定。
timezone = "Asia/Taipei"
# 網站網址，Telegram 按鈕與分享標籤用它組成連結；空字串表示不附連結。
url = "https://xjin9612.github.io/starfault/"
